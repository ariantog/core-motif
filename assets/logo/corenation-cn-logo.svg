<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Corenation CN logo">
  <!-- Hexagonal C frame: open on the right so the mark reads as C + N -->
  <path
    d="M 82 24 L 35 15 L 15 60 L 35 105 L 82 96"
    stroke="currentColor"
    stroke-width="10"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <!-- Stylized N (unchanged character; sits inside the C) -->
  <path
    d="M 40 32 L 40 88 M 40 32 L 72 88 M 72 32 L 72 88"
    stroke="currentColor"
    stroke-width="8"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
